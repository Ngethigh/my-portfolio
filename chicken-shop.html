<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuroyuki Fried Chicken | Premium Menu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --chicken-theme: #e63946;
            --chicken-accent: #ffb703;
            --chicken-bg: #0f0f0f;
        }

        .chicken-container {
            padding-top: 100px;
            padding-bottom: 5rem;
        }

        .chicken-hero {
            text-align: center;
            margin-bottom: 4rem;
            position: relative;
        }

        .chicken-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: var(--chicken-theme);
            margin-bottom: 1rem;
            text-shadow: 2px 2px 10px rgba(230, 57, 70, 0.3);
        }

        .chicken-hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .chicken-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .chicken-card {
            background: #1a1a1a;
            border: 2px solid transparent;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chicken-card:hover {
            transform: scale(1.05);
            border-color: var(--chicken-accent);
            box-shadow: 0 10px 30px rgba(255, 183, 3, 0.2);
        }

        .chicken-img {
            height: 220px;
            background: #2a2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            color: var(--chicken-accent);
        }

        .chicken-info {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .chicken-price {
            font-size: 1.5rem;
            color: var(--chicken-theme);
            font-weight: 700;
            margin: 1rem 0;
        }

        .order-group {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }

        .qty-input {
            width: 70px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 12px;
            padding: 0.5rem;
            text-align: center;
            font-size: 1rem;
            outline: none;
        }

        .qty-input:focus {
            border-color: var(--chicken-accent);
        }

        .order-btn {
            background: var(--chicken-theme);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .order-btn:hover {
            background: var(--chicken-accent);
            color: #000;
            transform: translateY(-2px);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
        }

        .modal-content {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(230, 57, 70, 0.3);
            padding: 3rem;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal.show .modal-content {
            transform: translateY(0);
        }

        .modal-icon {
            font-size: 4rem;
            color: var(--chicken-theme);
            margin-bottom: 1.5rem;
        }

        .close-btn {
            margin-top: 2rem;
            background: var(--chicken-theme);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
        }

        .cart-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--chicken-accent);
            color: #000;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .cart-float:hover {
            transform: scale(1.1) rotate(15deg);
        }

        .cart-float span {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--chicken-theme);
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            font-size: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 1001;
        }

        .home-link:hover {
            color: var(--chicken-accent);
        }

        .lang-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }
    </style>
</head>

<body>

    <div class="bg-gradient-1"></div>
    <div class="bg-gradient-2"></div>

    <a href="index.html" class="home-link" data-i18n="back_home">
        <i class="fas fa-arrow-left"></i> Home
    </a>

    <div class="lang-container dropdown" style="position: absolute; top: 20px; right: 20px; z-index: 1001;">
        <button class="lang-btn">
            <i class="fas fa-globe"></i> <span id="current-lang-text">EN</span> <i class="fas fa-caret-down"></i>
        </button>
        <ul class="dropdown-content lang-dropdown-content">
            <li onclick="changeLanguage('en')"><a>English</a></li>
            <li onclick="changeLanguage('th')"><a>ไทย</a></li>
            <li onclick="changeLanguage('zh')"><a>中文</a></li>
            <li onclick="changeLanguage('ja')"><a>日本語</a></li>
        </ul>
    </div>

    <div class="container chicken-container">
        <div class="chicken-hero">
            <h1 data-i18n="nav_store">Everything Store</h1>
            <h2 style="color: var(--chicken-accent); margin-top: 1rem; font-family: 'Playfair Display', serif;"
                data-i18n="chicken_title">Kuroyuki Menu</h2>
            <p data-i18n="chicken_desc">The best fried chicken in town, served with our secret recipes. ShiniFuyu
                Shipper.</p>

            <div style="margin-top: 2rem;">
                <a href="drinks-shop.html" class="btn primary"
                    style="background: var(--chicken-accent); color: #000; border: none; padding: 1rem 2rem; border-radius: 50px; text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 0.8rem;">
                    <i class="fas fa-glass-whiskey"></i> <span data-i18n="btn_view_drinks">View Drinks Section</span>
                </a>
            </div>
        </div>

        <div class="chicken-grid">
            <!-- Product 1 -->
            <div class="chicken-card">
                <div class="chicken-img"><i class="fas fa-drumstick-bite"></i></div>
                <div class="chicken-info">
                    <h3 data-i18n="chicken_menu_orig">Original Recipe</h3>
                    <div class="chicken-price">฿159</div>
                    <div class="order-group">
                        <input type="number" value="1" min="1" class="qty-input" id="qty-orig">
                        <button class="order-btn" onclick="addToCart('Original', 'qty-orig')">
                            <i class="fas fa-plus"></i> <span data-i18n="chicken_order">Order Now</span>
                        </button>
                    </div>
                </div>
            </div>
            <!-- Product 2 -->
            <div class="chicken-card">
                <div class="chicken-img"><i class="fas fa-fire"></i></div>
                <div class="chicken-info">
                    <h3 data-i18n="chicken_menu_spicy">Kuroyuki Spicy</h3>
                    <div class="chicken-price">฿169</div>
                    <div class="order-group">
                        <input type="number" value="1" min="1" class="qty-input" id="qty-spicy">
                        <button class="order-btn" onclick="addToCart('Spicy', 'qty-spicy')">
                            <i class="fas fa-plus"></i> <span data-i18n="chicken_order">Order Now</span>
                        </button>
                    </div>
                </div>
            </div>
            <!-- Product 3 -->
            <div class="chicken-card">
                <div class="chicken-img"><i class="fas fa-stroopwafel"></i></div>
                <div class="chicken-info">
                    <h3 data-i18n="chicken_menu_garlic">Garlic Butter</h3>
                    <div class="chicken-price">฿179</div>
                    <div class="order-group">
                        <input type="number" value="1" min="1" class="qty-input" id="qty-garlic">
                        <button class="order-btn" onclick="addToCart('Garlic', 'qty-garlic')">
                            <i class="fas fa-plus"></i> <span data-i18n="chicken_order">Order Now</span>
                        </button>
                    </div>
                </div>
            </div>
            <!-- Product 4 -->
            <div class="chicken-card">
                <div class="chicken-img"><i class="fas fa-tint"></i></div>
                <div class="chicken-info">
                    <h3 data-i18n="chicken_menu_soy">Soy Garlic</h3>
                    <div class="chicken-price">฿179</div>
                    <div class="order-group">
                        <input type="number" value="1" min="1" class="qty-input" id="qty-soy">
                        <button class="order-btn" onclick="addToCart('Soy', 'qty-soy')">
                            <i class="fas fa-plus"></i> <span data-i18n="chicken_order">Order Now</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="cart-float" onclick="checkout()">
        <i class="fas fa-shopping-basket"></i>
        <span id="cartCount">0</span>
    </div>

    <!-- Modals -->
    <div id="shopModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon"><i class="fas fa-utensils"></i></div>
            <h3 id="modalTitle">Kuroyuki Info</h3>
            <p id="modalMsg">Message goes here.</p>
            <button class="close-btn" onclick="closeModal()">Got it!</button>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Load cart from localStorage
        let count = parseInt(localStorage.getItem('cart_total')) || 0;
        document.getElementById('cartCount').innerText = count;

        function addToCart(item, inputId) {
            const qtyInput = document.getElementById(inputId);
            const qty = parseInt(qtyInput.value) || 1;

            count += qty;
            updateCart();

            // Animation
            const cart = document.querySelector('.cart-float');
            cart.style.transform = 'scale(1.3)';
            setTimeout(() => cart.style.transform = 'scale(1)', 200);

            // Reset input
            qtyInput.value = 1;

            showModal('Added to Cart', `Added ${qty} ${item} Chicken to your basket!`);
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = count;
            localStorage.setItem('cart_total', count);
        }

        function checkout() {
            if (count > 0) {
                showModal('Order Success', `Thank you! Kuroyuki is preparing your ${count} orders. ✨`);
                count = 0;
                updateCart();
            } else {
                showModal('Oops!', "Your basket is empty! 🍗");
            }
        }

        // Modal Control
        const modal = document.getElementById('shopModal');
        const mTitle = document.getElementById('modalTitle');
        const mMsg = document.getElementById('modalMsg');

        function showModal(title, msg) {
            mTitle.innerText = title;
            mMsg.innerText = msg;
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeModal() {
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        window.onclick = function (event) {
            if (event.target == modal) closeModal();
        }
    </script>
</body>

</html>
